<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Monitor SDN - UrbIA</title>
  <script src="https://cdn.jsdelivr.net/npm/chart.js"></script>
  <link rel="stylesheet" href="/static/css/style.css">
  <link rel="stylesheet" href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.0/dist/css/bootstrap.min.css">
</head>
<body>
  <div class="container mt-4">
    <h1 class="mb-4"><span class="text-primary">🌐 Monitor SDN - UrbIA</span></h1>
    <p class="lead">Visualiza los flujos y puertos activos en la red.</p>

    <div class="card mb-4">
      <div class="card-header bg-warning text-dark"><strong>📊 Estadísticas de Puertos</strong></div>
      <div class="card-body">
        <canvas id="puertosChart" height="200"></canvas>
      </div>
    </div>

    <div class="card">
      <div class="card-header bg-info text-white"><strong>🔀 Flujos por Switch</strong></div>
      <div class="card-body" id="tabla-flujos">
        <p>Cargando flujos...</p>
      </div>
    </div>
  </div>

  <script src="/static/js/monitor.js"></script>
</body>
</html>
